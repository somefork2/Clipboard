<!DOCTYPE html>
<meta charset="utf-8">
<title>CopyWell store shots</title>
<style>
  :root {
    --blue: #2F6FED; --blue-deep: #1B4FC4; --ink: #10141C; --ink-soft: #565F6E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  body { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }

  .frame { position: relative; width: 1440px; height: 900px; overflow: hidden; }
  .light { background:
      radial-gradient(1100px 700px at 80% 68%, #dce7ff 0%, rgba(220,231,255,0) 62%),
      linear-gradient(160deg, #f5f6fa 0%, #e6e9f2 100%); color: var(--ink); }
  .dark { background:
      radial-gradient(950px 620px at 72% 62%, #1b2f63 0%, rgba(27,47,99,0) 66%),
      linear-gradient(160deg, #0d1017 0%, #151b28 100%); color: #eef1f7; }

  .copy { position: absolute; left: 88px; top: 104px; width: 540px; }
  .copy.center { left: 0; right: 0; width: auto; text-align: center; top: 76px; }
  .copy.center .sub { margin: 18px auto 0; max-width: 820px; }
  .eyebrow { font-size: 17px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--blue-deep); }
  .dark .eyebrow { color: #7aa2ff; }
  h1 { font-size: 64px; line-height: 1.04; font-weight: 700; letter-spacing: -0.026em; margin-top: 14px; text-wrap: balance; }
  .sub { font-size: 24px; line-height: 1.35; color: #565F6E; margin-top: 18px; max-width: 480px; text-wrap: pretty; }
  .dark .sub { color: #a6b1c8; }

  /* A generic macOS window used as the stage. */
  .win { position: absolute; background: #fbfbfd; border-radius: 15px; overflow: hidden;
         box-shadow: 0 0 0 .5px rgba(16,20,28,.14), 0 44px 96px -12px rgba(16,28,60,.26), 0 12px 32px rgba(16,28,60,.10); }
  .dark .win { background: #1b1f28; box-shadow: 0 0 0 .5px rgba(255,255,255,.12), 0 34px 96px rgba(0,0,0,.6); }
  .bar { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid rgba(16,20,28,.07); }
  .dark .bar { border-color: rgba(255,255,255,.07); }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .bar .t { flex: 1; text-align: center; font-size: 13px; font-weight: 600; color: #737b8a; margin-right: 60px; }

  /* CopyWell's palette, drawn to match the app. */
  .pal { position: absolute; width: 470px; border-radius: 16px; overflow: hidden; background: #f3f4f7;
         box-shadow: 0 0 0 .5px rgba(16,20,28,.16), 0 40px 90px -8px rgba(16,28,60,.38), 0 10px 26px rgba(16,28,60,.16); }
  .dark .pal { background: #232833; box-shadow: 0 0 0 .5px rgba(255,255,255,.14), 0 40px 90px rgba(0,0,0,.66); }
  .pal .search { display: flex; align-items: center; gap: 11px; padding: 15px 18px; font-size: 18px; color: #8b93a3; border-bottom: 1px solid rgba(16,20,28,.07); }
  .dark .pal .search { border-color: rgba(255,255,255,.07); color: #8d97ab; }
  .pal .search b { color: #10141C; font-weight: 400; }
  .dark .pal .search b { color: #eef1f7; }
  .caret { display: inline-block; width: 2px; height: 20px; background: var(--blue); vertical-align: -4px; }
  .clip { display: flex; align-items: center; gap: 12px; padding: 11px 18px; }
  .clip .n { width: 14px; text-align: right; font-size: 13px; color: #9aa2b1; flex: none; }
  .clip .ic { width: 34px; height: 34px; border-radius: 9px; background: #e3e6ed; display: flex; align-items: center; justify-content: center; font-size: 16px; flex: none; }
  .dark .clip .ic { background: #333a49; }
  .clip .tx { min-width: 0; }
  .clip .tx b { display: block; font-size: 16px; font-weight: 400; color: #10141C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dark .clip .tx b { color: #eef1f7; }
  .clip .tx span { font-size: 13px; color: #838b9a; }
  .clip.on { background: #cddcff; }
  .dark .clip.on { background: #2b3450; }
  .pal .foot { display: flex; align-items: center; gap: 16px; padding: 12px 18px; border-top: 1px solid rgba(16,20,28,.07); font-size: 13px; color: #737b8a; }
  .dark .pal .foot { border-color: rgba(255,255,255,.07); }
  .key { display: inline-block; min-width: 24px; text-align: center; padding: 3px 7px; border-radius: 6px; background: #e3e6ed; color: #444c5c; font-size: 12px; margin-right: 6px; }
  .dark .key { background: #333a49; color: #c3cad8; }

  .tag { position: absolute; padding: 14px 24px; border-radius: 999px; background: var(--blue); color: #fff;
         font-size: 27px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; box-shadow: 0 18px 42px rgba(47,111,237,.36); }
  .tag:after { content: ""; position: absolute; left: 40px; bottom: -11px; border: 11px solid transparent; border-top-color: var(--blue); border-bottom: 0; }
  .tag.up:after { bottom: auto; top: -11px; border: 11px solid transparent; border-bottom-color: var(--blue); border-top: 0; }

  .mail { padding: 24px 30px; font-size: 17px; line-height: 1.6; color: #333b49; }
  .mail .f { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(16,20,28,.07); font-size: 15px; }
  .mail .f i { color: #8b93a3; font-style: normal; width: 52px; }
  .dark .mail { color: #c9d1e0; }
  .dark .mail .f { border-color: rgba(255,255,255,.07); }
</style>
<body></body>
<script>
const N = new URLSearchParams(location.search).get('n') || '1';
const dots = '<span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span>';
const bar = t => `<div class="bar">${dots}<div class="t">${t}</div></div>`;
const clip = (n, ic, title, meta, on) =>
  `<div class="clip ${on ? 'on' : ''}"><div class="n">${n}</div><div class="ic">${ic}</div><div class="tx"><b>${title}</b><span>${meta}</span></div></div>`;
const foot = `<div class="foot"><span><span class="key">⏎</span>Copy</span><span><span class="key">⌘1–9</span>Jump</span><span><span class="key">⌘Y</span>Preview</span></div>`;
const rows = `
  ${clip(1, '🔗', 'https://developer.apple.com/documentation', 'Safari · 4 min ago', true)}
  ${clip(2, '✉️', 'dana.whitfield@northstarlabs.com', 'Mail · 9 min ago')}
  ${clip(3, '📄', 'Northstar Labs, 144 Bridge Street, Edinburgh', 'Notes · 22 min ago')}
  ${clip(4, '{ }', 'docker compose up --build -d', 'Terminal · 1 hr ago')}
  ${clip(5, '📄', 'Invoice 2026-0418 · Due 30 September', 'Numbers · 2 hr ago')}`;

const frames = {
1: () => `<section class="frame light">
  <div class="copy">
    <div class="eyebrow">Clipboard history for Mac</div>
    <h1>Everything you copy, one keystroke away</h1>
    <div class="sub">Press ⌥⌘V in any app. The palette opens right where you are.</div>
  </div>
  <div class="win" style="left:700px; top:120px; width:660px; height:520px;">
    ${bar('New Message')}
    <div class="mail">
      <div class="f"><i>To</i> dana.whitfield@northstarlabs.com</div>
      <div class="f"><i>Subject</i> Q3 figures</div>
      <div style="padding-top:18px">Hi Dana,<br><br>Here is the link we talked about:<span class="caret"></span></div>
    </div>
  </div>
  <div class="pal" style="left:520px; top:392px;">
    <div class="search">🔍 <b>Search clips</b><span class="caret"></span></div>
    ${rows}
    ${foot}
  </div>
</section>`,

2: () => `<section class="frame dark">
  <div class="copy center">
    <div class="eyebrow">Search</div>
    <h1>Find it in a second, weeks later</h1>
    <div class="sub">Type a word and the thing you copied last Tuesday is right there.</div>
  </div>
  <div class="pal" style="left:430px; top:322px; width:580px;">
    <div class="search">🔍 <b>invoice</b><span class="caret"></span></div>
    ${clip(1, '📄', 'Invoice 2026-0418 · Due 30 September', 'Numbers · last Tuesday', true)}
    ${clip(2, '✉️', 'Invoice query — Northstar Labs', 'Mail · 8 September')}
    ${clip(3, '🔗', 'northstar.example/billing/invoices', 'Safari · 2 September')}
    ${clip(4, '📄', 'Invoice template — final', 'Pages · 27 August')}
    ${clip(5, '{ }', 'SELECT * FROM invoices WHERE paid = false', 'TablePlus · 21 August')}
    ${foot}
  </div>
  <div class="tag" style="left:1000px; top:268px;">5 matches, instantly</div>
</section>`,

3: () => `<section class="frame light">
  <div class="copy">
    <div class="eyebrow">Pinboards</div>
    <h1>Never retype the same thing again</h1>
    <div class="sub">Signatures, snippets, addresses — kept where you can always reach them.</div>
  </div>
  <div class="win" style="left:680px; top:186px; width:680px; height:528px;">
    ${bar('CopyWell')}
    <div style="display:grid; grid-template-columns: 210px 1fr; height:calc(100% - 44px)">
      <div style="background:#f0f1f5; border-right:1px solid rgba(16,20,28,.07); padding:14px 10px; font-size:15px; color:#3b4453">
        <div style="font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:#8b93a3; padding:6px 10px">Library</div>
        <div style="padding:9px 10px; border-radius:9px">🕘 &nbsp;History</div>
        <div style="padding:9px 10px; border-radius:9px">☆ &nbsp;Favourites</div>
        <div style="font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:#8b93a3; padding:14px 10px 6px">Pinboards</div>
        <div style="padding:9px 10px; border-radius:9px; background:#cddcff">{ } &nbsp;Snippets</div>
        <div style="padding:9px 10px; border-radius:9px">💬 &nbsp;Replies</div>
        <div style="padding:9px 10px; border-radius:9px">🏷 &nbsp;Addresses</div>
      </div>
      <div style="padding:8px 0">
        ${clip('', '{ }', 'let total = items.reduce(0) { $0 + $1.amount }', 'Xcode', true)}
        ${clip('', '{ }', 'docker compose up --build -d', 'Terminal')}
        ${clip('', '{ }', 'git rebase -i origin/main', 'Terminal')}
        ${clip('', '{ }', 'SELECT * FROM invoices WHERE paid = false', 'TablePlus')}
        ${clip('', '{ }', 'ssh deploy@northstar.example', 'Terminal')}
        ${clip('', '{ }', 'npm run build -- --production', 'Terminal')}
        ${clip('', '{ }', 'brew services restart postgresql', 'Terminal')}
      </div>
    </div>
  </div>
</section>`,

4: () => `<section class="frame dark">
  <div class="copy center">
    <div class="eyebrow">Even screenshots</div>
    <h1>It reads the words inside your images</h1>
    <div class="sub">Copy a screenshot and you can still search what it says.</div>
  </div>
  <div class="pal" style="left:430px; top:322px; width:580px;">
    <div class="search">🔍 <b>wi-fi</b><span class="caret"></span></div>
    <div class="clip on" style="align-items:flex-start; padding:16px 18px">
      <div class="n" style="padding-top:22px">1</div>
      <div style="width:124px; height:84px; border-radius:9px; flex:none; background:#11151d; border:1px solid rgba(255,255,255,.12); padding:11px 12px; font-size:10px; line-height:1.6; color:#9fb0cc; overflow:hidden">
        Northstar Summit<br>Wi-Fi: Northstar-Guest<br>Hall B, level 2
      </div>
      <div class="tx">
        <b>Screenshot · 1280 × 720</b>
        <span>Preview · yesterday</span>
        <div style="margin-top:8px; font-size:13px; color:#8fb4ff">Recognised: “Wi-Fi: Northstar-Guest…”</div>
      </div>
    </div>
    ${clip(2, '📄', 'Wi-Fi details for the Edinburgh office', 'Notes · last week')}
    ${clip(3, '🔗', 'northstar.example/guest-wifi', 'Safari · last week')}
    ${foot}
  </div>
  <div class="tag" style="left:1000px; top:268px;">Found inside the picture</div>
</section>`,

5: () => `<section class="frame light">
  <div class="copy">
    <div class="eyebrow">Privacy</div>
    <h1>It refuses to see your passwords</h1>
    <div class="sub">No permission to control your Mac. Nothing uploaded. Ever.</div>
  </div>
  <div class="win" style="left:720px; top:230px; width:600px; height:326px;">
    ${bar('Password Manager')}
    <div style="padding:26px 30px">
      <div style="font-size:15px; color:#8b93a3">Northstar Labs</div>
      <div style="font-size:21px; margin-top:6px">dana.whitfield@northstarlabs.com</div>
      <div style="margin-top:20px; font-size:15px; color:#8b93a3">Password</div>
      <div style="font-size:25px; letter-spacing:.14em; margin-top:4px">••••••••••••</div>
      <div style="margin-top:22px; display:inline-flex; align-items:center; gap:10px; padding:11px 17px; border-radius:12px; background:#e8ecf6; font-size:16px; color:#3b4453">
        📋 Copied to clipboard
      </div>
    </div>
  </div>
  <div class="tag" style="left:700px; top:590px;">CopyWell did not record this</div>
  <div style="position:absolute; left:700px; top:672px; font-size:19px; color:#565F6E; max-width:600px; line-height:1.45">
    Anything your password manager marks as secret is skipped, and so is anything shaped like a key.
  </div>
</section>`,

6: () => `<section class="frame light">
  <div class="copy center">
    <div class="eyebrow">In every app</div>
    <h1>Right there in the right-click menu</h1>
    <div class="sub">And in the menu bar, and in Finder. Wherever you already are.</div>
  </div>
  <div class="win" style="left:330px; top:330px; width:560px; height:340px;">
    ${bar('Meeting notes')}
    <div class="mail"><div style="padding-top:6px">Meeting moved to Thursday at 15:00.<br>Same room, same link.</div></div>
  </div>
  <div style="position:absolute; left:680px; top:400px; width:340px; border-radius:12px; background:#fbfbfd; padding:7px; font-size:16px; color:#10141C; box-shadow:0 0 0 .5px rgba(16,20,28,.16), 0 30px 70px rgba(16,28,60,.32)">
    <div style="padding:8px 14px">Copy</div>
    <div style="padding:8px 14px">Paste</div>
    <div style="height:1px; background:rgba(16,20,28,.09); margin:6px 0"></div>
    <div style="padding:8px 14px; border-radius:8px; background:#2F6FED; color:#fff">Save to CopyWell</div>
    <div style="padding:8px 14px">Pin to CopyWell</div>
    <div style="padding:8px 14px">Paste from CopyWell</div>
  </div>
</section>`,

// Frames 7 and 8 are the app itself, not a drawing of it: a real capture of
// the whole window, rendered by `CopyWell --demo-content --render-screenshots
// --all-themes --language en`. The other frames stage the palette over a mock
// app, which shows the moment the product earns its keep but never shows the
// window — which is what the listing was missing.
7: () => `<section class="frame light">
  <div class="copy center" style="top:56px">
    <div class="eyebrow">All of it, in one window</div>
    <h1>Everything you copied, still there</h1>
  </div>
  <div class="win" style="left:230px; top:222px; width:980px;">
    ${bar('CopyWell')}
    <!-- The capture has no toolbar: a plain NSHostingView is not a window that
         SwiftUI will attach one to. The empty strip that leaves under the title
         bar is cropped off here rather than filled with a drawing of a toolbar
         that would not quite match the real one. -->
    <div style="height:545px; overflow:hidden">
      <img src="out/window/paper.png" style="display:block; width:100%; margin-top:-30px">
    </div>
  </div>
</section>`,

8: () => `<section class="frame dark">
  <div class="copy center" style="top:56px">
    <div class="eyebrow">Seven themes</div>
    <h1>Including one that is almost black</h1>
  </div>
  <div class="win" style="left:230px; top:222px; width:980px;">
    ${bar('CopyWell')}
    <!-- The capture has no toolbar: a plain NSHostingView is not a window that
         SwiftUI will attach one to. The empty strip that leaves under the title
         bar is cropped off here rather than filled with a drawing of a toolbar
         that would not quite match the real one. -->
    <div style="height:545px; overflow:hidden">
      <img src="out/window/ink.png" style="display:block; width:100%; margin-top:-30px">
    </div>
  </div>
</section>`,
};
document.body.innerHTML = (frames[N] || frames[1])();
</script>
